version: '3.8'

services:
  db:
    image: postgres:17-alpine       
    container_name: pg_in_memory    
    environment:
      POSTGRES_USER: postgres       
      POSTGRES_PASSWORD: postgres   
      POSTGRES_DB: postgres          
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=12G
    restart: always
